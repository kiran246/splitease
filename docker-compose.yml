version: '3.9'

# ── Local development with PostgreSQL (matches production) ────────────────────
# Usage:
#   docker compose up -d          # start postgres + app
#   docker compose up db -d       # start only postgres, run app with `npm run dev`
#
# For SQLite (default local dev, no Docker needed):
#   npm run dev                   # uses file:./prisma/dev.db

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: splitease
      POSTGRES_PASSWORD: splitease_dev
      POSTGRES_DB: splitease
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U splitease']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://splitease:splitease_dev@db:5432/splitease
      NEXTAUTH_SECRET: local-dev-secret-change-in-prod
      NEXTAUTH_URL: http://localhost:3000
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_placeholder}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      NODE_ENV: production

volumes:
  postgres_data:
