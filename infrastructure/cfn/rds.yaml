AWSTemplateFormatVersion: '2010-09-09'
Description: SplitEase — RDS PostgreSQL Multi-AZ

Parameters:
  Environment:
    Type: String
  VpcId:
    Type: AWS::EC2::VPC::Id
  IsolatedSubnetA:
    Type: AWS::EC2::Subnet::Id
  IsolatedSubnetB:
    Type: AWS::EC2::Subnet::Id
  ECSSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  DBSecretArn:
    Type: String
  DBInstanceClass:
    Type: String
    Default: db.t3.medium
    AllowedValues: [db.t3.micro, db.t3.small, db.t3.medium, db.r6g.large, db.r6g.xlarge]

Conditions:
  IsProduction: !Equals [!Ref Environment, prod]

Resources:
  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDS PostgreSQL — allow ECS only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref ECSSecurityGroupId
      Tags:
        - Key: Name
          Value: !Sub splitease-${Environment}-rds-sg

  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub SplitEase ${Environment} isolated subnets
      SubnetIds: [!Ref IsolatedSubnetA, !Ref IsolatedSubnetB]

  DBParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Family: postgres16
      Description: !Sub SplitEase ${Environment} parameter group
      Parameters:
        log_min_duration_statement: '1000'   # log queries > 1s
        shared_preload_libraries: pg_stat_statements
        pg_stat_statements.track: all

  DBInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub splitease-${Environment}
      DBName: splitease
      Engine: postgres
      EngineVersion: '16.3'
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: '20'
      MaxAllocatedStorage: 100            # autoscaling up to 100 GB
      StorageType: gp3
      StorageEncrypted: true
      MultiAZ: !If [IsProduction, true, false]
      DBSubnetGroupName: !Ref DBSubnetGroup
      DBParameterGroupName: !Ref DBParameterGroup
      VPCSecurityGroups: [!Ref DBSecurityGroup]
      MasterUsername: !Sub '{{resolve:secretsmanager:${DBSecretArn}:SecretString:username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DBSecretArn}:SecretString:password}}'
      BackupRetentionPeriod: !If [IsProduction, 7, 1]
      PreferredBackupWindow: '02:00-03:00'
      PreferredMaintenanceWindow: 'sun:04:00-sun:05:00'
      EnablePerformanceInsights: !If [IsProduction, true, false]
      PerformanceInsightsRetentionPeriod: !If [IsProduction, 7, !Ref AWS::NoValue]
      DeletionProtection: !If [IsProduction, true, false]
      PubliclyAccessible: false
      CopyTagsToSnapshot: true
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # CloudWatch alarm — high DB connections
  DBConnectionsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub splitease-${Environment}-db-connections-high
      MetricName: DatabaseConnections
      Namespace: AWS/RDS
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref DBInstance

Outputs:
  DBEndpoint:
    Value: !GetAtt DBInstance.Endpoint.Address
    Export: {Name: !Sub '${AWS::StackName}-DBEndpoint'}
  DBPort:
    Value: !GetAtt DBInstance.Endpoint.Port
    Export: {Name: !Sub '${AWS::StackName}-DBPort'}
  DBSecurityGroupId:
    Value: !Ref DBSecurityGroup
    Export: {Name: !Sub '${AWS::StackName}-DBSecurityGroupId'}
