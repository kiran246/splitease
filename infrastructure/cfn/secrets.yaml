AWSTemplateFormatVersion: '2010-09-09'
Description: SplitEase — Secrets Manager secrets

Parameters:
  Environment:
    Type: String

Resources:
  DBSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub splitease/${Environment}/db
      Description: RDS PostgreSQL credentials
      GenerateSecretString:
        SecretStringTemplate: '{"username":"splitease"}'
        GenerateStringKey: password
        ExcludeCharacters: '"@/\\'
        PasswordLength: 32

  AppSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub splitease/${Environment}/app
      Description: Application secrets
      SecretString: !Sub |
        {
          "NEXTAUTH_SECRET": "REPLACE_ME_openssl_rand_base64_32",
          "STRIPE_SECRET_KEY": "REPLACE_ME_sk_live_...",
          "SMTP_HOST": "email-smtp.${AWS::Region}.amazonaws.com",
          "SMTP_PORT": "587",
          "SMTP_USER": "REPLACE_ME_ses_smtp_user",
          "SMTP_PASS": "REPLACE_ME_ses_smtp_password"
        }

Outputs:
  DBSecretArn:
    Value: !Ref DBSecret
    Export: {Name: !Sub '${AWS::StackName}-DBSecretArn'}
  AppSecretArn:
    Value: !Ref AppSecret
    Export: {Name: !Sub '${AWS::StackName}-AppSecretArn'}
